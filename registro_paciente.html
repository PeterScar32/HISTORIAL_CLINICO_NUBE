<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC NUBE | REGISTRO</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* BARRA SUPERIOR ORIGINAL */
        .top-bar { width: 100%; background: #212529; padding: 12px 20px; color: white; display: flex; align-items: center; font-size: 13px; font-weight: 800; text-transform: uppercase; }
        .top-bar a { color: white; text-decoration: none; cursor: pointer; }

        .card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; margin-top: 40px; }
        
        .logo-img { height: 50px; margin-bottom: 10px; }

        h2 { color: #1e293b; font-size: 1.5rem; margin-bottom: 30px; text-transform: uppercase; font-weight: 900; letter-spacing: -0.5px; }
        
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group select { width: 100%; box-sizing: border-box; }
        label { font-size: 11px; font-weight: 800; color: #475569; text-transform: uppercase; margin-left: 2px; }
        
        input, select { 
            width: 100%; padding: 14px; margin-top: 6px; border: 2px solid #e2e8f0; 
            border-radius: 12px; box-sizing: border-box; font-size: 16px; 
            font-weight: 700; text-transform: uppercase; transition: 0.3s; color: #1e293b;
        }
        input:focus { border-color: #22c55e; outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1); }
        input::placeholder { color: #cbd5e1; font-weight: 400; text-transform: none; }
        
        .codigo-box { 
            background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 15px; 
            padding: 20px; margin: 25px 0;
        }
        .cod-text { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; }
        #display-codigo { font-size: 2.8rem; font-weight: 900; color: #1e293b; letter-spacing: 2px; }

        .btn-guardar { 
            width: 100%; background: #2ecc71; color: white; border: none; 
            padding: 18px; border-radius: 12px; font-weight: 900; font-size: 16px; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }
        .btn-guardar:hover { background: #27ae60; transform: translateY(-1px); }

        .btn-consultar {
            background: #007bff; color: white; border: none; padding: 14px 35px;
            border-radius: 8px; font-weight: 800; margin-top: 25px; cursor: pointer;
            font-size: 15px; text-transform: uppercase; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }
        .btn-consultar:hover { background: #0069d9; }
    </style>
    <script src="config.js?v=11"></script>
</head>
<body>

<div class="top-bar">
    <a href="index.html">← VOLVER AL MENÚ PRINCIPAL</a>
</div>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" class="logo-img">
    </div>
    
    <h2>REGISTRO DE PACIENTE</h2>

    <div class="input-group">
        <label>Nombres</label>
        <input type="text" id="nombre" placeholder="EJ. ELMER" oninput="generarCodigo()">
    </div>

    <div class="input-group">
        <label>Apellidos Paterno/Materno</label>
        <input type="text" id="apellido" placeholder="EJ. HERMOSA" oninput="generarCodigo()">
    </div>

    <div class="input-group">
        <label>Cédula de Identidad (CI)</label>
        <input type="text" id="ci" placeholder="EJ. 2543253" oninput="this.value=this.value.toUpperCase().replace(/\s+/g,''); generarCodigo()" onchange="verificarExistente()">
    </div>

    <div class="codigo-box">
        <div class="cod-text">Código Generado</div>
        <div id="display-codigo">----</div>
    </div>
    <div id="aviso-existente" style="display:none;margin:-6px 0 18px;padding:12px;border-radius:10px;background:#fef3c7;color:#92400e;font-weight:700;font-size:13px;text-align:left;"></div>

    <div class="cod-text" style="text-align:left;margin-bottom:10px;">Datos de esta evaluación</div>

    <div class="input-group">
        <label>Empresa</label>
        <input type="text" id="empresa" placeholder="EJ. EMPRESA CONTRATANTE">
    </div>

    <div class="input-group">
        <label>Puesto de trabajo</label>
        <input type="text" id="puesto" placeholder="EJ. OPERARIO DE PLANTA">
    </div>

    <div class="input-group">
        <label>Tipo de evaluación</label>
        <select id="tipo_eval">
            <option value="PREOCUPACIONAL">PREOCUPACIONAL (INGRESO)</option>
            <option value="PERIODICO">PERIÓDICO</option>
            <option value="RETIRO">RETIRO</option>
            <option value="OTRO">OTRO</option>
        </select>
    </div>

    <div class="input-group">
        <label>Fecha de evaluación</label>
        <input type="date" id="fecha_eval">
    </div>

    <div class="input-group">
        <label>Fichas que se realizarán en esta evaluación</label>
        <div id="lista-fichas" style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:12px;font-weight:700;color:#334155;"></div>
        <div style="font-size:11px;color:#64748b;margin-top:6px;">Las marcadas son obligatorias para dar la evaluación por completa. Las demás pueden registrarse igual como adicionales.</div>
    </div>

    <button class="btn-guardar" onclick="enviarDatos()">GUARDAR REGISTRO FINAL</button>
</div>

<button class="btn-consultar" onclick="location.href='lista_historial.html'">CONSULTAR BASE DE DATOS</button>

<script>
    const API_URL = CONFIG.API_BASE;

    function generarCodigo() {
        const nom = document.getElementById('nombre').value.trim().toUpperCase();
        const ape = document.getElementById('apellido').value.trim().toUpperCase();
        const ciVal = document.getElementById('ci').value.trim();
        const display = document.getElementById('display-codigo');

        if (nom && ape && ciVal) {
            const codigo = ciVal.toUpperCase();
            display.innerText = codigo;
            return codigo;
        } else {
            display.innerText = "----";
            return "";
        }
    }

    let pacienteExistente = null;

    document.getElementById('fecha_eval').value = new Date().toLocaleDateString('en-CA');

    (async () => {
        try {
            const cat = await (await fetch(`${API_URL}/catalogo-fichas`)).json();
            document.getElementById('lista-fichas').innerHTML = cat.map(c => `
                <label style="display:flex;gap:6px;align-items:center;text-transform:none;font-size:12px;color:#334155;margin:0;">
                    <input type="checkbox" class="ficha-req" value="${esc(c.clave)}" ${c.por_defecto ? 'checked' : ''} style="width:auto;margin:0;">${esc(c.nombre)}
                </label>`).join('');
        } catch (e) {}
    })();

    async function verificarExistente() {
        const ci = document.getElementById('ci').value.trim().toUpperCase();
        const aviso = document.getElementById('aviso-existente');
        pacienteExistente = null;
        aviso.style.display = 'none';
        if (!ci) return;
        try {
            const r = await fetch(`${API_URL}/pacientes/buscar/${encodeURIComponent(ci)}`);
            if (!r.ok) return;
            pacienteExistente = await r.json();
            aviso.textContent = `⚠ ESTE CI YA ESTÁ REGISTRADO COMO ${pacienteExistente.apellido} ${pacienteExistente.nombre}. AL GUARDAR SE INICIARÁ UNA NUEVA EVALUACIÓN EN SU MISMO EXPEDIENTE.`;
            aviso.style.display = 'block';
            if (!document.getElementById('nombre').value) document.getElementById('nombre').value = pacienteExistente.nombre;
            if (!document.getElementById('apellido').value) document.getElementById('apellido').value = pacienteExistente.apellido;
            generarCodigo();
        } catch (e) {}
    }

    async function enviarDatos() {
        const codigo = generarCodigo();
        if (!codigo) { alert("COMPLETE TODOS LOS CAMPOS."); return; }

        await verificarExistente();
        let paciente = pacienteExistente;

        if (paciente) {
            const nueva = confirm(`EL CI ${paciente.ci} YA ESTÁ REGISTRADO COMO ${paciente.apellido} ${paciente.nombre}.\n\nACEPTAR: INICIAR UNA NUEVA EVALUACIÓN EN SU EXPEDIENTE.\nCANCELAR: VER SU EXPEDIENTE SIN CREAR NADA.`);
            if (!nueva) {
                fijarPacienteActual(paciente);
                localStorage.setItem('p_id_reporte', paciente.id);
                window.location.href = 'informe.html';
                return;
            }
        }

        try {
            if (!paciente) {
                const response = await fetch(`${API_URL}/pacientes/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: document.getElementById('nombre').value.toUpperCase(),
                        apellido: document.getElementById('apellido').value.toUpperCase(),
                        ci: document.getElementById('ci').value.trim().toUpperCase()
                    })
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    alert("❌ NO SE PUDO REGISTRAR: " + (err.detail || response.status));
                    return;
                }
                paciente = await response.json();
            }

            const rEv = await fetch(`${API_URL}/evaluaciones/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    paciente_id: paciente.id,
                    empresa: document.getElementById('empresa').value,
                    puesto: document.getElementById('puesto').value,
                    tipo: document.getElementById('tipo_eval').value,
                    fecha: document.getElementById('fecha_eval').value || null,
                    fichas_requeridas: [...document.querySelectorAll('.ficha-req:checked')].map(c => c.value)
                })
            });
            if (!rEv.ok) { alert("❌ NO SE PUDO CREAR LA EVALUACIÓN."); return; }
            const ev = await rEv.json();

            ['p_id', 'p_id_edicion', 'p_id_reporte', 'p_eval', 'p_ci', 'p_cod', 'p_nom', 'edit_modo', 'temp_p2'].forEach(k => localStorage.removeItem(k));
            fijarPacienteActual(paciente);
            localStorage.setItem('p_eval', ev.id);

            alert(pacienteExistente ? "✅ NUEVA EVALUACIÓN INICIADA." : "✅ REGISTRADO CON ÉXITO.");
            window.location.href = 'declaracion_jurada_p1.html';
        } catch (e) { alert("❌ ERROR DE CONEXIÓN CON EL SERVIDOR."); }
    }
</script>
</body>
</html>
