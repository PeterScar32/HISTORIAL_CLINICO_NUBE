<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC NUBE | Inicio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #020617; color: #e2e8f0; font-family: "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 70px 16px 40px; }
        .oculto { display: none !important; }
        .centro { text-align: center; width: 100%; max-width: 980px; }
        .logo { width: 150px; height: 150px; border-radius: 50%; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
        h1 { font-size: 32px; letter-spacing: -.01em; margin: 18px 0 4px; text-transform: uppercase; }
        .sub { color: #64748b; font-size: 12px; letter-spacing: .35em; text-transform: uppercase; margin: 0 0 36px; }
        .loader { border: 6px solid rgba(255,255,255,.1); border-top-color: #3b82f6; border-radius: 50%; width: 50px; height: 50px; margin: 0 auto 14px; animation: giro 1s linear infinite; }
        @keyframes giro { to { transform: rotate(360deg); } }
        .perfiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
        .perfil { background: #0f172a; border: 1px solid #1e293b; border-radius: 22px; padding: 22px 14px 18px; cursor: pointer; color: inherit; transition: border-color .2s, transform .2s; }
        .perfil:hover, .perfil:focus-visible { border-color: #22c55e; transform: translateY(-2px); outline: none; }
        .perfil img, .perfil .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #1e293b; display: block; margin: 0 auto 12px; }
        .perfil .avatar { background: #0f766e; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .perfil .nombre { font-weight: 800; font-size: 13px; line-height: 1.25; }
        .perfil .cargo { color: #64748b; font-size: 11px; margin-top: 6px; line-height: 1.3; }
        .caja { background: #0f172a; border: 1px solid #1e293b; border-radius: 24px; padding: 30px; max-width: 380px; margin: 0 auto; }
        .caja img, .caja .avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #22c55e; display: block; margin: 0 auto 14px; }
        .caja .avatar { background: #0f766e; display: flex; align-items: center; justify-content: center; font-size: 46px; }
        .caja h2 { font-size: 16px; margin: 0 0 4px; }
        .caja p { color: #94a3b8; font-size: 12px; margin: 0 0 18px; }
        input[type=password] { width: 100%; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 12px; padding: 14px; font-size: 16px; text-align: center; margin-bottom: 10px; }
        input[type=password]:focus { outline: none; border-color: #22c55e; }
        .btn { width: 100%; border: none; border-radius: 999px; padding: 13px; font-weight: 900; font-size: 12px; letter-spacing: .12em; cursor: pointer; text-transform: uppercase; }
        .btn-principal { background: #16a34a; color: #fff; }
        .btn-principal:hover { background: #15803d; }
        .btn-texto { background: transparent; color: #64748b; margin-top: 8px; }
        .error { color: #f87171; font-size: 12px; font-weight: 700; min-height: 18px; margin: 4px 0 8px; }
        .opciones { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; margin-bottom: 28px; }
        .opcion { width: 200px; padding: 40px 10px; background: #0f172a; border: 1px solid #1e293b; border-radius: 40px; cursor: pointer; color: #cbd5e1; transition: border-color .2s; }
        .opcion:hover { border-color: #3b82f6; }
        .opcion .ico { font-size: 44px; margin-bottom: 14px; }
        .opcion span { font-size: 13px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
        .bienvenida { display: inline-flex; align-items: center; gap: 12px; background: #0f172a; border: 1px solid #1e293b; border-radius: 999px; padding: 6px 18px 6px 6px; margin-bottom: 30px; }
        .bienvenida img, .bienvenida .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #22c55e; }
        .bienvenida .avatar { background: #0f766e; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; }
        .bienvenida div { text-align: left; font-size: 13px; font-weight: 800; }
        .bienvenida small { display: block; color: #64748b; font-weight: 600; font-size: 11px; }
        .pie { color: #334155; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; margin-top: 30px; }
    </style>
    <script src="config.js?v=8"></script>
</head>
<body>
<main class="centro">
    <img src="img/logo_ohs_circulo.png" alt="OHS · Trabajo sano, seguro y productivo" class="logo">
    <h1>Historial Clínico Nube</h1>
    <p class="sub" id="subtitulo">¿Quién eres?</p>

    <section id="paso-cargando">
        <div class="loader"></div>
        <p class="sub" style="margin:0">Conectando con el servidor…</p>
    </section>

    <section id="paso-perfiles" class="oculto">
        <div class="perfiles" id="perfiles"></div>
    </section>

    <section id="paso-clave" class="oculto">
        <form class="caja" id="form-clave" autocomplete="off">
            <div id="clave-foto"></div>
            <h2 id="clave-nombre"></h2>
            <p id="clave-cargo"></p>
            <input type="password" id="clave" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
            <div class="error" id="error-clave"></div>
            <button class="btn btn-principal" type="submit">Ingresar</button>
            <button class="btn btn-texto" type="button" onclick="mostrar('paso-perfiles')">← No soy yo</button>
        </form>
    </section>

    <section id="paso-cambio" class="oculto">
        <form class="caja" id="form-cambio" autocomplete="off">
            <h2>Elige tu contraseña personal</h2>
            <p>Es tu primer ingreso. Reemplaza la contraseña temporal por una que solo tú conozcas (mínimo 8 caracteres).</p>
            <input type="password" id="nueva1" placeholder="Nueva contraseña" aria-label="Nueva contraseña" autocomplete="new-password">
            <input type="password" id="nueva2" placeholder="Repite la nueva contraseña" aria-label="Repite la nueva contraseña" autocomplete="new-password">
            <div class="error" id="error-cambio"></div>
            <button class="btn btn-principal" type="submit">Guardar y continuar</button>
        </form>
    </section>

    <section id="paso-portal" class="oculto">
        <div class="bienvenida" id="bienvenida"></div>
        <div class="opciones" id="opciones"></div>
        <p class="pie">Sistema de Gestión de Historias Clínicas · OHS</p>
    </section>
</main>

<script>
    const API = CONFIG.API_BASE;
    let perfilElegido = null;
    let claveTemporal = "";

    function mostrar(id) {
        ["paso-cargando", "paso-perfiles", "paso-clave", "paso-cambio", "paso-portal"].forEach(p =>
            document.getElementById(p).classList.toggle("oculto", p !== id));
        const sub = { "paso-perfiles": "¿Quién eres?", "paso-clave": "Ingresa tu contraseña", "paso-cambio": "Primer ingreso", "paso-portal": "Panel de control de acceso", "paso-cargando": "" };
        document.getElementById("subtitulo").textContent = sub[id];
        if (id === "paso-clave") setTimeout(() => document.getElementById("clave").focus(), 50);
        if (id === "paso-cambio") setTimeout(() => document.getElementById("nueva1").focus(), 50);
    }

    function avatar(p) {
        return p.foto ? `<img src="${esc(p.foto)}" alt="Foto de ${esc(p.nombre)}">` : `<div class="avatar">⚕️</div>`;
    }

    function elegir(p) {
        perfilElegido = p;
        document.getElementById("clave-foto").innerHTML = avatar(p);
        document.getElementById("clave-nombre").textContent = p.nombre;
        document.getElementById("clave-cargo").textContent = p.cargo || "";
        document.getElementById("clave").value = "";
        document.getElementById("error-clave").textContent = "";
        mostrar("paso-clave");
    }

    async function cargarPerfiles() {
        for (let intento = 0; intento < 8; intento++) {
            try {
                const r = await fetch(`${API}/auth/perfiles`, { cache: "no-store" });
                if (r.ok) {
                    const perfiles = await r.json();
                    const cont = document.getElementById("perfiles");
                    cont.innerHTML = "";
                    perfiles.forEach(p => {
                        const b = document.createElement("button");
                        b.type = "button";
                        b.className = "perfil";
                        b.innerHTML = `${avatar(p)}<div class="nombre">${esc(p.nombre)}</div><div class="cargo">${esc(p.cargo || "")}</div>`;
                        b.onclick = () => elegir(p);
                        cont.appendChild(b);
                    });
                    mostrar("paso-perfiles");
                    return;
                }
            } catch (e) {}
            await new Promise(res => setTimeout(res, 5000));
        }
        document.querySelector("#paso-cargando .sub").textContent = "No se pudo conectar con el servidor. Recarga la página.";
    }

    function mostrarPortal() {
        const s = sesion();
        const u = s.usuario;
        document.getElementById("bienvenida").innerHTML = `${avatar(u)}<div>${esc(u.nombre)}<small>${esc(u.rol === "MEDICO" ? "Acceso completo" : "Registro de datos")}</small></div>`;
        const opciones = u.rol === "MEDICO"
            ? [["semaforo.html", "🚦", "Semáforo"], ["lista_historial.html", "🗂️", "Pacientes"], ["enfermera.html", "⚕️", "Registro y fichas"], ["opciones_visor.html", "🔍", "Visor e informes"], ["lista_personal.html", "👨‍⚕️", "Personal"]]
            : [["enfermera.html", "⚕️", "Registro y fichas"], ["lista_historial.html", "🗂️", "Pacientes"]];
        document.getElementById("opciones").innerHTML = opciones.map(([href, ico, texto]) =>
            `<button class="opcion" onclick="location.href='${href}'"><div class="ico">${ico}</div><span>${texto}</span></button>`).join("");
        if (u.rol === "MEDICO") {
            document.getElementById("opciones").insertAdjacentHTML("afterend",
                `<p><button class="btn btn-texto" style="width:auto;color:#94a3b8" type="button" onclick="descargarRespaldo(this)">💾 Descargar respaldo de la base de datos</button></p>`);
        }
        if (!document.getElementById("chip-usuario")) insigniaUsuario();
        mostrar("paso-portal");
    }

    async function descargarRespaldo(boton) {
        boton.disabled = true;
        boton.textContent = "Preparando respaldo…";
        try {
            const r = await fetch(`${API}/admin/respaldo`);
            if (!r.ok) throw new Error();
            const blob = await r.blob();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `respaldo_hc_nube_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            boton.textContent = "✅ Respaldo descargado";
        } catch (e) {
            boton.textContent = "❌ No se pudo descargar el respaldo";
        }
        boton.disabled = false;
    }

    document.getElementById("form-clave").addEventListener("submit", async e => {
        e.preventDefault();
        const clave = document.getElementById("clave").value;
        const error = document.getElementById("error-clave");
        error.textContent = "";
        try {
            const r = await fetch(`${API}/auth/login`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario: perfilElegido.usuario, clave })
            });
            const d = await r.json();
            if (!r.ok) { error.textContent = d.detail || "No se pudo ingresar"; return; }
            guardarSesion(d.token, d.usuario);
            if (d.usuario.debe_cambiar) { claveTemporal = clave; mostrar("paso-cambio"); }
            else mostrarPortal();
        } catch (err) { error.textContent = "Error de conexión con el servidor"; }
    });

    document.getElementById("form-cambio").addEventListener("submit", async e => {
        e.preventDefault();
        const n1 = document.getElementById("nueva1").value;
        const n2 = document.getElementById("nueva2").value;
        const error = document.getElementById("error-cambio");
        if (n1 !== n2) { error.textContent = "Las contraseñas no coinciden"; return; }
        try {
            const r = await fetch(`${API}/auth/cambiar-clave`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ actual: claveTemporal, nueva: n1 })
            });
            const d = await r.json();
            if (!r.ok) { error.textContent = d.detail || "No se pudo cambiar"; return; }
            guardarSesion(d.token, d.usuario);
            mostrarPortal();
        } catch (err) { error.textContent = "Error de conexión con el servidor"; }
    });

    const actual = sesion();
    if (actual && !actual.usuario.debe_cambiar) mostrarPortal();
    else { cerrarSesionSilenciosa(); cargarPerfiles(); }

    function cerrarSesionSilenciosa() {
        try { localStorage.removeItem("ohs_token"); localStorage.removeItem("ohs_usuario"); } catch (e) {}
    }
</script>
</body>
</html>
