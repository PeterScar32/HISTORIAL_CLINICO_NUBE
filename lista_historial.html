<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTORIAL CLÍNICO NUBE | LISTADO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 1100px; margin-top: 30px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background: #1e293b; color: white; padding: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .table thead { background-color: #f8fafc; }
        .table th { font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        .table td { vertical-align: middle; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #1e293b; }
        .btn-action { padding: 6px 10px; border-radius: 8px; border: none; font-size: 1.1rem; transition: 0.3s; margin: 0 2px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        .btn-reporte { background-color: #22c55e; color: white; }
        .btn-reporte:hover { background-color: #16a34a; transform: scale(1.1); }
        .btn-editar { background-color: #f59e0b; color: white; }
        .btn-editar:hover { background-color: #d97706; transform: scale(1.1); }
        .btn-borrar { background-color: #ef4444; color: white; }
        .btn-borrar:hover { background-color: #dc2626; transform: scale(1.1); }
        .top-bar { width: 100%; background: #343a40; padding: 10px 20px; color: white; margin-bottom: 20px; }
        .top-bar a { color: white; text-decoration: none; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; }
        .contador-badge { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-left: 10px; vertical-align: middle; }
        body { background-color: #020617; color: #e2e8f0; padding-top: 30px; }
        .top-bar { background: transparent; }
        .card { background: #0f172a; border: 1px solid #1e293b; box-shadow: none; }
        .card-header { background: #0f172a; border-bottom: 1px solid #1e293b; }
        .table { --bs-table-bg: transparent; --bs-table-hover-bg: #111c33; --bs-table-color: #e2e8f0; --bs-table-hover-color: #fff; }
        .table thead { background-color: #0b1222; }
        .table th { color: #94a3b8; border-bottom: 1px solid #1e293b; }
        .table td { color: #e2e8f0; border-color: #1e293b; }
        .badge.bg-light { background: #1e293b !important; color: #cbd5e1 !important; border-color: #334155 !important; }
        .buscador { display: flex; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #1e293b; flex-wrap: wrap; }
        .buscador input { flex: 1; min-width: 220px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
        .buscador button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: 12px; }
        #papelera { display: none; padding: 14px 16px; border-top: 1px solid #1e293b; }
        #papelera h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; }
        #papelera table td, #papelera table th { font-size: .78rem; text-transform: none; }
    </style>
    <script src="config.js?v=9"></script>
</head>
<body>

<div class="top-bar">
    <a href="index.html" onclick="limpiarEdicion()">← VOLVER</a>
</div>

<div class="container">
    <div class="card">
        <div class="card-header text-center">
            BASE DE DATOS DE PACIENTES - OHS
            <span id="totalPacientes" class="contador-badge">Cargando...</span>
        </div>
        <div class="card-body p-0">
            <div class="buscador">
                <input type="search" id="buscar" placeholder="Buscar por CI, apellido o nombre…" aria-label="Buscar paciente" oninput="filtrarLista()">
                <button type="button" class="btn-papelera" onclick="verPapelera()">🗑️ Papelera</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">PACIENTE</th>
                            <th>CI</th>
                            <th>CÓDIGO</th>
                            <th class="text-center">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="listaPacientes"></tbody>
                </table>
            </div>
            <div id="papelera">
                <h3>Papelera · pacientes eliminados</h3>
                <p style="font-size:12px;color:#94a3b8">Al eliminar un paciente se guarda una copia completa de su expediente. Desde aquí se puede restaurar con todas sus evaluaciones y fichas.</p>
                <div class="table-responsive"><table class="table mb-0"><thead><tr><th>CI</th><th>Paciente</th><th>Evaluaciones</th><th>Eliminado</th><th>Restaurado</th><th></th></tr></thead><tbody id="filasPapelera"></tbody></table></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = CONFIG.API_BASE;

    async function cargarPacientes() {
        const tabla = document.getElementById('listaPacientes');
        const contador = document.getElementById('totalPacientes');
        try {
            const resp = await fetch(`${API}/pacientes/`);
            if (!resp.ok) throw new Error("Error en servidor");
            const pacientes = await resp.json();
            
            tabla.innerHTML = "";
            if (!pacientes || pacientes.length === 0) {
                contador.innerText = "TOTAL: 0";
                tabla.innerHTML = `<tr><td colspan="4" class="text-center py-4">NO HAY REGISTROS DISPONIBLES</td></tr>`;
                return;
            }
            
            contador.innerText = `TOTAL: ${pacientes.length}`;
            window._pacientes = {};
            let colores = {};
            try {
                const sem = await (await fetch(`${API}/semaforo?solo_ultima=true`)).json();
                sem.items.forEach(i => { colores[i.paciente_id] = i; });
            } catch (e) {}
            const tonos = { ROJO: '#ef4444', AMARILLO: '#f59e0b', VERDE: '#22c55e', GRIS: '#94a3b8' };
            pacientes.forEach(p => {
                window._pacientes[p.id] = p;
                const id = parseInt(p.id);
                tabla.innerHTML += `
                    <tr>
                        <td class="ps-4"><span title="${esc(colores[p.id] ? colores[p.id].motivo : 'Sin evaluación')}" style="display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;background:${tonos[(colores[p.id] || {}).color || 'GRIS']}"></span>${esc(p.apellido)} ${esc(p.nombre)}</td>
                        <td>${esc(p.ci) || 'S/N'}</td>
                        <td><span class="badge bg-light text-dark border">${esc(p.codigo_paciente) || '---'}</span></td>
                        <td class="text-center">
                            <button class="btn-action btn-reporte" title="REPORTE" onclick="verReporte(${id})">📄</button>
                            <button class="btn-action btn-editar" title="EDITAR" onclick="editarPaciente(${id})">✏️</button>
                            <button class="btn-action btn-borrar" title="BORRAR" onclick="eliminarPaciente(${id})">🗑️</button>
                        </td>
                    </tr>`;
            });
        } catch (e) { 
            contador.innerText = "ERROR DE CONEXIÓN";
            tabla.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">EL SERVIDOR NO RESPONDE</td></tr>`;
        }
    }

    function verReporte(id) {
        if (window._pacientes && window._pacientes[id]) fijarPacienteActual(window._pacientes[id]);
        localStorage.setItem('p_id_reporte', id);
        window.location.href = "informe.html";
    }

    function editarPaciente(id) {
        if (window._pacientes && window._pacientes[id]) fijarPacienteActual(window._pacientes[id]);
        localStorage.removeItem('p_id_edicion');
        localStorage.setItem('edit_modo', 'true');
        localStorage.setItem('p_id', id); 
        window.location.href = "declaracion_jurada_p1.html";
    }

    function limpiarEdicion() {
        localStorage.removeItem('edit_modo');
        localStorage.removeItem('p_id');
    }

    function filtrarLista() {
        const q = document.getElementById('buscar').value.trim().toUpperCase().split(/\s+/).filter(Boolean);
        document.querySelectorAll('#listaPacientes tr').forEach(tr => {
            const t = tr.innerText.toUpperCase();
            tr.style.display = q.every(w => t.includes(w)) ? '' : 'none';
        });
    }

    async function eliminarPaciente(id) {
        const p = (window._pacientes || {})[id];
        if (!p) return;
        const escrito = prompt(`Va a eliminar a ${p.apellido} ${p.nombre} con todas sus evaluaciones y fichas.\n\nEl expediente se guardará en la papelera y podrá restaurarse.\n\nPara confirmar, escriba el CI del paciente (${p.ci}):`);
        if (escrito === null) return;
        try {
            const response = await fetch(`${API}/api/pacientes/${id}?confirmar_ci=${encodeURIComponent(escrito)}`, { method: 'DELETE' });
            const d = await response.json().catch(() => ({}));
            if (response.ok) {
                alert("Paciente enviado a la papelera. Puede restaurarlo desde el botón 🗑️ Papelera.");
                location.reload();
            } else {
                alert("No se eliminó: " + (d.detail || response.status));
            }
        } catch (error) {
            alert("Error de conexión con el servidor.");
        }
    }

    async function verPapelera() {
        const caja = document.getElementById('papelera');
        caja.style.display = caja.style.display === 'block' ? 'none' : 'block';
        if (caja.style.display === 'none') return;
        const r = await fetch(`${API}/papelera`);
        if (!r.ok) { document.getElementById('filasPapelera').innerHTML = '<tr><td colspan="6">Solo los médicos pueden ver la papelera.</td></tr>'; return; }
        const items = await r.json();
        document.getElementById('filasPapelera').innerHTML = items.length ? items.map(x => `
            <tr><td>${esc(x.ci)}</td><td>${esc(x.nombre)}</td><td>${x.evaluaciones}</td>
            <td>${fechaServidor(x.eliminado_en).toLocaleString('es-BO')}<div style="color:#94a3b8">${esc(x.eliminado_por || '')}</div></td>
            <td>${x.restaurado_en ? fechaServidor(x.restaurado_en).toLocaleString('es-BO') + '<div style="color:#94a3b8">' + esc(x.restaurado_por || '') + '</div>' : '—'}</td>
            <td>${x.restaurado_en ? '' : `<button class="btn btn-sm btn-outline-light" onclick="restaurar(${x.id})">Restaurar</button>`}</td></tr>`).join('')
            : '<tr><td colspan="6">La papelera está vacía.</td></tr>';
    }

    async function restaurar(id) {
        if (!confirm('¿Restaurar este paciente con todas sus evaluaciones y fichas?')) return;
        const r = await fetch(`${API}/papelera/${id}/restaurar`, { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { alert('Paciente restaurado.'); location.reload(); }
        else alert('No se pudo restaurar: ' + (d.detail || r.status));
    }

    window.onload = cargarPacientes;
</script>
</body>
</html>
